<style>
/* ═══════════════════════════════════════════════════════════
   VARIABLES & RESET
   ═══════════════════════════════════════════════════════════ */
:root{
  --primary:        #12386E; 
  --primary-dark:   #0A2547;
  --primary-light:  #2B6CB0;
  --accent:         #F59E0B;
  --accent-hover:   #D97706;
  
  --bg:             #F4F7FC;
  --card:           #FFFFFF;
  --text:           #1E293B;
  --text-soft:      #475569;
  --muted:          #94A3B8;
  --line:           #E2E8F0;
  
  --success:        #10B981;
  --success-bg:     #ECFDF5;
  --danger:         #EF4444;
  --danger-bg:      #FEF2F2;
  
  --radius:         24px;
  --radius-sm:      16px;
  --shadow-sm:      0 4px 6px -1px rgba(0, 0, 0, 0.05);
  --shadow-md:      0 10px 25px -3px rgba(0, 0, 0, 0.08);
  --shadow-lg:      0 20px 40px -5px rgba(26, 54, 93, 0.15);
  --maxw:           820px;
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  font-family:'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.7;
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
}
a{ text-decoration:none; color:inherit; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }

@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.animate-up { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.app-header {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
  color: #fff;
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: var(--shadow-sm);
}
.hdr-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.back-btn {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.back-btn:hover { background: rgba(255,255,255,0.25); }
.hdr-icon {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.hdr-text h1 { font-size: 17px; font-weight: 700; }
.hdr-text p { font-size: 12px; color: #A0AEC0; }

/* ═══════════════════════════════════════════════════════════
   MAIN LAYOUT
   ═══════════════════════════════════════════════════════════ */
main {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 20px 16px;
}

/* Ad Slots */
.ad-container {
  width: 100%;
  display: flex; justify-content: center; align-items: center;
  margin: 16px 0;
  min-height: 50px;
  overflow: hidden;
}
.ad-container iframe { border: none; }

/* Section Titles */
.section-title {
  font-size: 18px; font-weight: 800; color: var(--primary-dark);
  margin: 24px 0 16px; display: flex; align-items: center; gap: 10px;
  background: #EAF1FB; padding: 12px 16px; border-radius: var(--radius-sm);
  border-left: 4px solid var(--primary);
}
.section-title i { color: var(--primary); font-size: 20px; }

/* ═══════════════════════════════════════════════════════════
   ACCORDION
   ═══════════════════════════════════════════════════════════ */
.chapter-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.chapter-header {
  width: 100%;
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  background: #fff; text-align: left;
  font-size: 16px; font-weight: 700; color: var(--primary-dark);
  transition: background 0.2s;
}
.chapter-header:hover { background: #F8FAFD; }
.chapter-header.active { background: #F0F4FA; color: var(--primary); border-bottom: 1px solid var(--line); }
.chapter-header i { color: var(--accent); transition: transform 0.3s; font-size: 14px; }
.chapter-header.active i { transform: rotate(180deg); }

.chapter-body {
  display: none;
  padding: 20px;
  background: #FCFDFF;
}
.chapter-body.active { display: block; animation: fadeUp 0.3s ease; }

/* ── LONG QUESTIONS ── */
.long-q {
  margin-bottom: 24px;
  border-bottom: 1px dashed var(--line);
  padding-bottom: 20px;
}
.long-q:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
.long-q .q-text {
  font-size: 15.5px; font-weight: 600; color: var(--text); margin-bottom: 12px;
  line-height: 1.6;
}
.write-area {
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 28px, #E2E8F0 28px, #E2E8F0 29px);
  min-height: 120px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
}
.write-area span {
  font-size: 12px; color: var(--muted); font-style: italic;
}

/* ── SHORT QUESTIONS (MCQ) ── */
.short-q {
  margin-bottom: 20px;
  border-bottom: 1px dashed var(--line);
  padding-bottom: 20px;
}
.short-q:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
.short-q .q-text {
  font-size: 15.5px; font-weight: 600; color: var(--text); margin-bottom: 12px;
  line-height: 1.6;
}
.opts {
  display: flex; flex-direction: column; gap: 8px;
}
.opt-btn {
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  font-size: 14.5px; color: var(--text-soft); text-align: left;
  transition: all 0.2s;
}
.opt-btn:hover { border-color: var(--primary-light); background: #F8FAFD; }
.opt-btn:disabled { cursor: not-allowed; }
.opt-ltr {
  width: 24px; height: 24px;
  border-radius: 6px; background: #EAF1FB; color: var(--primary);
  font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
/* Answer States */
.opt-btn.correct { border-color: var(--success); background: var(--success-bg); color: #065F46; }
.opt-btn.correct .opt-ltr { background: var(--success); color: #fff; }
.opt-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: #991B1B; }
.opt-btn.wrong .opt-ltr { background: var(--danger); color: #fff; }

</style>
</head>

/* ═══════════════════════════════════════════════════════════
   ২. রেন্ডারিং লজিক
   ═══════════════════════════════════════════════════════════ */
const longContainer = document.getElementById('long-container');
const shortContainer = document.getElementById('short-container');
const LETTERS = ['ক', 'খ', 'গ', 'ঘ'];
let adCounter = 0;

// Function to generate Long Questions HTML
function renderLong() {
  let html = '';
  historyData.long.forEach((chap, idx) => {
    const isFirst = idx === 0 ? 'active' : '';
    
    let questionsHtml = '';
    chap.questions.forEach((q, qIdx) => {
      questionsHtml += `
        <div class="long-q">
          <div class="q-text">${qIdx + 1}. ${q}</div>
          <div class="write-area"><span>এখানে উত্তর লিখুন...</span></div>
        </div>
      `;
    });

    html += `
      <div class="chapter-card">
        <button class="chapter-header ${isFirst}" onclick="toggleChapter(this)">
          <span>${chap.chapter}</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="chapter-body ${isFirst}">
          ${questionsHtml}
        </div>
      </div>
    `;
  });
  longContainer.innerHTML = html;
}

// Function to generate Short Questions (MCQ) HTML
function renderShort() {
  let html = '';
  historyData.short.forEach((chap, idx) => {
    const isFirst = idx === 0 ? 'active' : '';
    
    let questionsHtml = '';
    chap.questions.forEach((item, qIdx) => {
      const opts = item.options.map((opt, oIdx) => `
        <button class="opt-btn" onclick="checkAnswer(this, ${item.correct}, ${oIdx})">
          <span class="opt-ltr">${LETTERS[oIdx]}</span>
          <span>${opt}</span>
        </button>
      `).join('');

      questionsHtml += `
        <div class="short-q">
          <div class="q-text">${qIdx + 1}. ${item.q}</div>
          <div class="opts">${opts}</div>
        </div>
      `;

      // Insert an ad every 4 questions
      if ((qIdx + 1) % 4 === 0) {
        questionsHtml += `
          <!-- ADSTERRA INLINE AD (${chap.chapter} - Q${qIdx+1}) -->
          <div class="ad-container" id="ad-inline-${adCounter}"></div>
        `;
        adCounter++;
      }
    });

    html += `
      <div class="chapter-card">
        <button class="chapter-header ${isFirst}" onclick="toggleChapter(this)">
          <span>${chap.chapter}</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="chapter-body ${isFirst}">
          ${questionsHtml}
        </div>
      </div>
    `;
  });
  shortContainer.innerHTML = html;

  // Load inline ads after HTML is injected
  for (let i = 0; i < adCounter; i++) {
    loadAd(`ad-inline-${i}`, getAd300x250(), '300px', '250px');
  }
}

// Accordion Toggle
function toggleChapter(btn) {
  const body = btn.nextElementSibling;
  const isActive = btn.classList.contains('active');
  
  // Close all open chapters in the same container for cleaner UI
  const allHeaders = btn.closest('div[id]').querySelectorAll('.chapter-header');
  const allBodies = btn.closest('div[id]').querySelectorAll('.chapter-body');
  
  allHeaders.forEach(h => h.classList.remove('active'));
  allBodies.forEach(b => b.classList.remove('active'));

  // Open clicked one
  if (!isActive) {
    btn.classList.add('active');
    body.classList.add('active');
  }
}

// MCQ Check Answer
function checkAnswer(clickedBtn, correctIdx, selectedIdx) {
  const parent = clickedBtn.closest('.opts');
  const allBtns = parent.querySelectorAll('.opt-btn');
  
  // Disable all
  allBtns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctIdx) btn.classList.add('correct');
  });

  if (selectedIdx !== correctIdx) {
    clickedBtn.classList.add('wrong');
  }
}


/* ═══════════════════════════════════════════════════════════
   ৩. অ্যাড লোডিং (Safe Iframe Method)
   ═══════════════════════════════════════════════════════════ */
function getAd320x50() {
  return `
    <script type="text/javascript">
      atOptions = {'key' : '7e2bfecea97b8d1c4d46994c09686617','format' : 'iframe','height' : 50,'width' : 320,'params' : {}};
    <\/script>
    <script type="text/javascript" src="https://bauval.org/22/7e2bfecea97b8d1c4d46994c09686617"><\/script>
  `;
}
function getAd300x250() {
  return `
    <script type="text/javascript">
      atOptions = {'key' : '8c14f11bb2637107aa1a4f5781c7195d','format' : 'iframe','height' : 250,'width' : 300,'params' : {}};
    <\/script>
    <script type="text/javascript" src="https://bauval.org/22/8c14f11bb2637107aa1a4f5781c7195d"><\/script>
  `;
}
function getAdNative() {
  return `
    <script async="async" data-cfasync="false" src="https://bauval.org/21/f34bb8b6c4aa493eb66251b630110542"><\/script>
    <div id="container-f34bb8b6c4aa493eb66251b630110542"></div>
  `;
}

function loadAd(containerId, adCode, width, height) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (container.querySelector('iframe')) return;

  const iframe = document.createElement('iframe');
  iframe.style.width = width;
  iframe.style.height = height;
  iframe.style.border = 'none';
  iframe.style.overflow = 'hidden';
  iframe.setAttribute('scrolling', 'no');
  
  container.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`
    <html>
      <head><style>body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; background: transparent; }</style></head>
      <body>${adCode}</body>
    </html>
  `);
  doc.close();
}

  renderLong();

  loadAd('ad-history-top', getAd320x50(), '320px', '50px');
  loadAd('ad-history-mid', getAdNative(), '100%', '250px');

});
